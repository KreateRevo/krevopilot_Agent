apiVersion: v1
kind: Namespace
metadata:
  name: krevopilot-system
  labels:
    app.kubernetes.io/part-of: krevopilot
    app.kubernetes.io/component: agent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: krevopilot-agent
  namespace: krevopilot-system
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: krevopilot-agent-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: krevopilot-agent-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: krevopilot-agent-readonly
subjects:
  - kind: ServiceAccount
    name: krevopilot-agent
    namespace: krevopilot-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: krevopilot-agent
  namespace: krevopilot-system
  labels:
    app.kubernetes.io/name: krevopilot-agent
    app.kubernetes.io/part-of: krevopilot
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: krevopilot-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: krevopilot-agent
        app.kubernetes.io/part-of: krevopilot
    spec:
      serviceAccountName: krevopilot-agent
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: mani7022/krevopilot-agent:2.0.25
          imagePullPolicy: IfNotPresent
          env:
            - name: PLATFORM_URL
              value: "https://kreaterevopilot.example.com"
            - name: CLUSTER_ID
              value: "customer-cluster"
            - name: AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: krevopilot-agent
                  key: agent-key
            - name: HASH_SALT
              valueFrom:
                secretKeyRef:
                  name: krevopilot-agent
                  key: hash-salt
            - name: INTERVAL_SECONDS
              value: "60"
            - name: MAX_PODS
              value: "150"
            - name: MAX_EVENTS
              value: "60"
            - name: VERIFY_TLS
              value: "true"
            - name: ALLOW_INSECURE_HTTP
              value: "false"
            - name: PRESERVE_NAMESPACES
              value: "true"
            - name: EVENT_MESSAGE_MODE
              value: "scrubbed"
            - name: LOGS_ENABLED
              value: "false"
            - name: LOGS_MAX_LINES
              value: "500"
            - name: LOGS_MAX_LOOKBACK_MINUTES
              value: "60"
            - name: LOGS_INCLUDE_PREVIOUS
              value: "true"
            - name: LOGS_MASK_EMAILS
              value: "true"
            - name: LOGS_MASK_PUBLIC_IPS
              value: "true"
            - name: LOGS_MASK_INTERNAL_IPS
              value: "false"
            - name: LOG_STORAGE_MODE
              value: "none"
            - name: EXTERNAL_LOG_SOURCE
              value: "none"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
