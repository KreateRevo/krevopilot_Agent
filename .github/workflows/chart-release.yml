name: Release Helm chart

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/chart-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Lint chart
        run: |
          helm lint charts/krevopilot-agent \
            --set platform.url=https://pilot.example.com \
            --set cluster.id=example-cluster \
            --set agent.key=example-agent-key

      - name: Package chart
        run: |
          mkdir -p .chart-packages
          helm package charts/krevopilot-agent --destination .chart-packages

      - name: Prepare chart repository branch
        run: |
          mkdir -p .chart-repo
          git fetch origin gh-pages --depth=1 || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add .chart-repo origin/gh-pages
          else
            git worktree add --detach .chart-repo
            cd .chart-repo
            git checkout --orphan gh-pages
            git rm -rf . || true
            cd ..
          fi

      - name: Update Helm repo index
        run: |
          cp .chart-packages/*.tgz .chart-repo/
          cd .chart-repo
          helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No chart changes to publish."
          else
            git commit -m "Release Helm chart"
            git push origin HEAD:gh-pages
          fi
