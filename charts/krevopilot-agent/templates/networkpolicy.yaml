{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "krevopilot-agent.fullname" . }}-egress
  labels:
    {{- include "krevopilot-agent.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "krevopilot-agent.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- if .Values.networkPolicy.allowDns }}
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- range .Values.networkPolicy.egressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- if .Values.diagnostics.enabled }}
    {{- range .Values.networkPolicy.diagnosticServiceCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
    {{- end }}
    {{- end }}
{{- end }}
