{{- if not .Values.agent.existingSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "krevopilot-agent.secretName" .) -}}
{{- $agentKeyData := "" -}}
{{- if .Values.agent.key -}}
{{- $agentKeyData = (.Values.agent.key | b64enc) -}}
{{- else if and $existing (index $existing.data "agent-key") -}}
{{- $agentKeyData = (index $existing.data "agent-key") -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "krevopilot-agent.secretName" . }}
  labels:
    {{- include "krevopilot-agent.labels" . | nindent 4 }}
type: Opaque
data:
  # A chart-only upgrade must never blank or rotate a working credential. If no
  # replacement is explicitly supplied, preserve the live Secret value in-cluster.
  agent-key: {{ required "agent.key is required for first install unless agent.existingSecret is set" $agentKeyData | quote }}
  {{- if .Values.agent.hashSalt }}
  hash-salt: {{ .Values.agent.hashSalt | b64enc | quote }}
  {{- else if and $existing (index $existing.data "hash-salt") }}
  hash-salt: {{ index $existing.data "hash-salt" | quote }}
  {{- else }}
  hash-salt: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}
