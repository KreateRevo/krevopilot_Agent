{{- if not .Values.agent.existingSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "krevopilot-agent.secretName" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "krevopilot-agent.secretName" . }}
  labels:
    {{- include "krevopilot-agent.labels" . | nindent 4 }}
type: Opaque
data:
  agent-key: {{ required "agent.key is required unless agent.existingSecret is set" .Values.agent.key | b64enc | quote }}
  {{- if .Values.agent.hashSalt }}
  hash-salt: {{ .Values.agent.hashSalt | b64enc | quote }}
  {{- else if and $existing (index $existing.data "hash-salt") }}
  hash-salt: {{ index $existing.data "hash-salt" | quote }}
  {{- else }}
  hash-salt: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
{{- end }}

